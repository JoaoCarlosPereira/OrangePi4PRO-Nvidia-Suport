# modeset=1 e obrigatorio para a saida de video da eGPU.
#
# fbdev=0 e o padrao SEGURO: mantem o console de texto no HDMI do Orange Pi.
# Quem decide mover o console e o egpu-video-apply, que recarrega o modulo com
# fbdev=1 somente depois de confirmar que existe monitor ligado na NVIDIA.
# Sem isso o fbcon vai para uma saida possivelmente sem monitor, e o resultado
# na tela e indistinguivel de um travamento.
options nvidia_drm modeset=1 fbdev=0
