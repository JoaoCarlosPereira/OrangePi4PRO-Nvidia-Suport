# modeset=1 e obrigatorio para a saida de video da eGPU.
#
# fbdev=0 SEMPRE. A emulacao fbdev do DRM segura o framebuffer e impede o
# servidor grafico de assumir o display; o resultado na tela e o console de
# texto (um traco no canto, ou texto distorcido) enquanto o Xorg roda saudavel
# ao lado, sem erro nenhum no log. O preco e nao ver mensagens de boot no
# monitor ligado na GPU -- elas continuam no journalctl.
options nvidia_drm modeset=1 fbdev=0
