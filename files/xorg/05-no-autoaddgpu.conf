# Impede o Xorg de anexar automaticamente GPUs secundarias (eGPU NVIDIA).
# Sem isto o servidor X trava carregando glamoregl em /dev/dri/card2 e o
# lightdm nao sobe. A tela continua saindo pelo HDMI do proprio Orange Pi.
Section "ServerFlags"
    Option "AutoAddGPU"  "off"
    Option "AutoBindGPU" "off"
EndSection
