# Layout que roda o servidor X inteiramente na RTX 3050 (saida pelas HDMI/DP
# da placa). O HDMI do Orange Pi fica sem imagem grafica, mas continua com o
# console de texto -- e por isso que nvidia_drm NAO usa fbdev=1.
# Instalado como /etc/X11/xorg.conf por  egpu-video-enable.

Section "Files"
    ModulePath "/usr/lib/aarch64-linux-gnu/nvidia/xorg"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "ServerLayout"
    Identifier "egpu-layout"
    Screen 0 "egpu-screen"
    Option "AutoAddGPU" "off"
EndSection

Section "Device"
    Identifier "egpu-device"
    Driver     "nvidia"
    BusID      "PCI:1:0:0"
    Option     "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Screen"
    Identifier "egpu-screen"
    Device     "egpu-device"
EndSection
