# "SSH a qualquer custo" -- sshd como daemon persistente, nao ativado por socket.
#
# O Ubuntu entrega o sshd ativado por socket. Isso tem um modo de falha que nos
# mordeu neste board: se o sshd nao consegue subir -- chaves de host ausentes
# depois de clonar um cartao, um sshd_config quebrado -- o ssh.socket estoura o
# limite de tentativas, entra em estado failed e PARA DE ESCUTAR. A porta 22
# fica fechada ate alguem com acesso fisico intervir. Num board headless cujo
# display e justamente a coisa que quebra, esse e o pior desfecho possivel.
#
# Por isso o install.sh desabilita o ssh.socket, habilita o ssh.service, e este
# drop-in torna esse daemon insistente por politica.

[Unit]
# Nunca desistir. Sem limite de tentativas.
StartLimitIntervalSec=0
StartLimitBurst=0
# Garante as chaves antes de tentar subir.
Wants=regen-ssh-host-keys.service
After=regen-ssh-host-keys.service

[Service]
Restart=always
RestartSec=3
# A unidade de fabrica se recusa a subir quando `sshd -t` falha, o que
# transforma um erro de sintaxe no config em "SSH nenhum". Removemos esse
# portao -- quem conserta o config e o egpu-ssh-guard. A atribuicao vazia
# limpa a lista herdada antes de acrescentar a nossa.
ExecStartPre=
ExecStartPre=-/usr/bin/ssh-keygen -A
# 255 e o codigo que o sshd devolve para erro de configuracao. A unidade de
# fabrica trata isso como "nao reinicie"; queremos o oposto, porque o guard
# pode estar consertando o config neste exato momento.
RestartPreventExitStatus=
# Mantem as sessoes abertas quando o processo principal e reiniciado -- e o que
# permite trocar o sshd por baixo de voce sem cortar a sua propria conexao.
KillMode=process
